projects:
  - name: EveryMotion
    status: Active — WIP
    description: >-
      An AI-powered, controller-free motion tracking platform for AR/VR. Removes the barrier
      between user and virtual world — no sensors, no controllers — using computer vision and
      RAG-enhanced predictive modelling. Core SDK back in active development.
    stack: [HTML / CSS / JS, Computer Vision, RAG / AI]
    links:
      github: https://github.com/KronTheDev/everymotion.github.io
      live: https://kronthedev.github.io/everymotion.github.io/
    source: fields.md

  - name: PsyPunker
    status: Active — WIP
    description: >-
      A dual-mode Tauri desktop application — a Builder (React + Monaco editor, compiler pipeline)
      and a Runner (Rust framing layer, WASM sandbox, fullscreen overlay). Kernels are signed
      bundles tied to the USB drive that issued them. Drive out, session gone, zero trace.
    stack: [TypeScript, Rust, Tauri, React, Ed25519 + Argon2id, Turborepo]
    links:
      github: https://github.com/KronTheDev/psypunker
    source: fields.md

  - name: Above The Line
    status: Active — WIP
    description: >-
      A post-apocalyptic narrative survival RPG set after the Yellowstone supereruption reshapes
      Vancouver's atmosphere in 2039. Society splits by elevation. The player leaves the fragile
      safety of a high-rise and travels upward. Project Director & Narrative Lead under
      KronStudios-Games.
    stack: [Unreal Engine, C++ / Blueprint, Git LFS, Quartz]
    links:
      github: https://github.com/KronStudios-Games/abovetheline
      # webdisplay (Quartz GDD wiki) is private: never link it
    source: fields.md

  - name: Monochromality
    status: Active — WIP
    description: >-
      A Backrooms-inspired first-person horror game by Null Concept. 15 mapped levels at initial
      release, each with unique hazards and audio ambiance, alongside three distinct entity types —
      the Howler, the Hounds, and the Duller.
    stack: [Unreal Engine, C++ / Blueprint]
    links:
      live: https://kronthedev.github.io/monochromality/
      steam: https://store.steampowered.com/app/3744840/Monochromality/
    source: fields.md

  - name: Primecit Mod
    show: false                      # Andrew chose to leave it out
    description: Minecraft mod (MCreator, MC 1.21.4) with the Thphobia dimension and Infinisea biome.
    source: [fields.md, d011]

