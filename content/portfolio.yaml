  - name: Above The Line
    status: WIP — Paused
    description: >-
      A first-person vertical narrative survival game set after the Yellowstone supereruption of
      Labor Day 2039 reshapes Vancouver's atmosphere. Society splits by elevation, above or below a
      toxic gas cloud. The player leaves the fragile safety of a high-rise and travels upward.
      Built in Unreal Engine 5.6 with a (semi-)diegetic UI. Project Director & Narrative Lead
      under KronStudios-Games.
    stack: [Unreal Engine 5.6, UE Blueprint, Git LFS, Supabase, Quartz]
    links:
