about:
  opener: '"Hey,"'
  glitch_name: true                # name glitches between the two identities
  paragraph_1:
    - "You've seen that opener before. So let's get to it: I'm Andrew — and I build things that probably shouldn't belong in the same portfolio."
    - "Code, systems, worlds, and the words that hold them together."
    - "I'm Ukrainian and French, fluent across four languages — and passable in a fifth, though I wouldn't recommend it. Somewhere between the text editor and the worlds that don't exist yet, that tends to show up in the work."
    - "This portfolio is the longer version."
    - "Scroll down to see where that lands."
  paragraph_2: >-
    Right now I'm focused on the space where those disciplines actually overlap — where a system
    needs a story to make sense, or a story needs a system to hold its weight. Most people pick a
    lane. I've never been particularly good at that. What I'm building toward is work that doesn't
    need a genre label. Games that read like literature. Narratives that function like
    architecture. Code that serves something larger than itself, while still having a self. In
    short, a vague reflection of what I embody. The distinction, if there is one: I don't treat any
    of these as separate crafts. They inform and interlap each other constantly. Their
    cross-contamination is usually where the most interesting work comes from, speaking from
    experience.
  tags:
    location: France / Ukraine
    open_to: [Freelance, Internship, Collaboration, Sales]
    domain: [Web, Game Dev, AI, Backend, B2B Sales]
  source: fields.md

